appId: com.novelweb.desktop
productName: NovelWeb
copyright: Copyright © 2026 Naams
asar: true
asarUnpack:
  - node_modules/pdfjs-dist/**
directories:
  output: dist
files:
  - out/**/*
  - package.json
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
artifactName: ${productName}-${version}-${arch}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
